<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志数据提取工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-family: "Consolas", "Courier New", monospace;
            font-size: 14px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #2a5298;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .result-box {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
        }

        .result-box pre {
            font-family: "Consolas", "Courier New", monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
            color: #333;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            padding: 10px 15px;
            background: #e9ecef;
            border-radius: 8px;
        }

        .stat-item {
            color: #666;
            font-size: 14px;
        }

        .stat-item span {
            color: #2a5298;
            font-weight: bold;
        }

        .file-input-wrapper {
            display: inline-block;
            position: relative;
        }

        .file-input {
            display: none;
        }

        .file-label {
            display: inline-block;
            padding: 12px 25px;
            background: #6c757d;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s;
        }

        .file-label:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 日志数据提取工具</h1>

        <div class="card">
            <h2>📥 输入日志（支持拖拽文件）</h2>
            <textarea id="inputLog" placeholder="请粘贴日志内容，或拖拽txt文件到此处...

格式示例：
2026-04-17 10:09:11 info:7A44000A0101000000000000465844334A0000000000430000000000D00200009B001300000000009AF95300E80254000000000000000000000100000000000000000000000000EE
2026-04-17 10:09:12 info:7A44000A01011A04110A083B465844334A0000002A00430000000000D00200009B001300000000009AF95300E802540036010000000080000001040502B6003C02D70009E00101B2"></textarea>
            <div class="btn-group">
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" class="file-input" accept=".txt,.log">
                    <label for="fileInput" class="file-label">📂 导入文件</label>
                </div>
                <button class="btn btn-primary" onclick="extractData()">🔍 提取数据</button>
                <button class="btn btn-secondary" onclick="clearAll()">🗑️ 清空</button>
            </div>
        </div>

        <div class="card">
            <h2>📤 提取结果</h2>
            <div class="stats" id="stats">
                <div class="stat-item">总行数: <span id="totalLines">0</span></div>
                <div class="stat-item">成功提取: <span id="extractedCount">0</span></div>
                <div class="stat-item">字符总长度: <span id="totalLength">0</span></div>
            </div>
            <div class="result-box">
                <pre id="result"></pre>
            </div>
            <div class="btn-group">
                <button class="btn btn-success" onclick="copyResult()">📋 复制结果</button>
                <button class="btn btn-secondary" onclick="downloadResult()">💾 下载JSON</button>
            </div>
        </div>
    </div>

    <script>
        let extractedData = [];

        // 文件导入
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('inputLog').value = event.target.result;
                };
                reader.readAsText(file, 'UTF-8');
            }
        });

        // 拖拽文件
        document.getElementById('inputLog').addEventListener('dragover', function(e) {
            e.preventDefault();
            this.style.borderColor = '#2a5298';
        });

        document.getElementById('inputLog').addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.style.borderColor = '#ddd';
        });

        document.getElementById('inputLog').addEventListener('drop', function(e) {
            e.preventDefault();
            this.style.borderColor = '#ddd';
            const file = e.dataTransfer.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('inputLog').value = event.target.result;
                };
                reader.readAsText(file, 'UTF-8');
            }
        });

        // 提取数据
        function extractData() {
            const input = document.getElementById('inputLog').value;
            const lines = input.split('\n');
            
            extractedData = [];
            
            lines.forEach(line => {
                line = line.trim();
                if (!line) return;
                
                // 查找 info: 后面的内容
                const match = line.match(/info:([A-Fa-f0-9]+)/);
                if (match) {
                    extractedData.push(match[1].toUpperCase());
                }
            });

            // 更新统计
            document.getElementById('totalLines').textContent = lines.filter(l => l.trim()).length;
            document.getElementById('extractedCount').textContent = extractedData.length;
            document.getElementById('totalLength').textContent = extractedData.reduce((sum, s) => sum + s.length, 0);

            // 显示结果
            document.getElementById('result').textContent = JSON.stringify(extractedData);
        }

        // 复制结果
        function copyResult() {
            if (extractedData.length === 0) {
                alert('没有可复制的数据，请先提取数据');
                return;
            }
            navigator.clipboard.writeText(JSON.stringify(extractedData)).then(() => {
                alert('已复制到剪贴板！');
            });
        }

        // 下载JSON
        function downloadResult() {
            if (extractedData.length === 0) {
                alert('没有可下载的数据，请先提取数据');
                return;
            }
            const blob = new Blob([JSON.stringify(extractedData)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'extracted_data.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        // 清空
        function clearAll() {
            document.getElementById('inputLog').value = '';
            document.getElementById('result').textContent = '';
            document.getElementById('totalLines').textContent = '0';
            document.getElementById('extractedCount').textContent = '0';
            document.getElementById('totalLength').textContent = '0';
            extractedData = [];
        }
    </script>
</body>
</html>
